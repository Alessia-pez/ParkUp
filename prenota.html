<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkUp - Le tue prenotazioni</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navigation">
    <a href="index.html">Home</a>
    <a href="lista.html"> Trova parcheggio</a>
    <a href="aggiungi.html"> Affitta il tuo posto</a>
    <a href="contatti.html">Contatti</a>
</div>

<div id="form-contenuto">

    <h2> Prenota</h2>
    <p>Compila il seguente modulo per riservare il tuo posto auto</p>

    <div id="messaggio"></div>

    <form method="post" action="conferma.html" onsubmit="return validaForm()">

        <h3>I tuoi dati</h3>

        <label for="nome">Nome e Cognome:</label>
        <input type="text" id="nome" name="nome" placeholder="Nome e Cognome">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Email">

        <label for="telefono">Telefono:</label>
        <input type="tel" id="telefono" name="telefono" placeholder="Telefono">

        <label for="data">Data:</label>
        <input type="date" id="data" name="data">

        <label for="ora-inizio">Ora inizio:</label>
        <input type="time" id="ora-inizio" name="ora-inizio">

        <label for="ora-fine">Ora fine:</label>
        <input type="time" id="ora-fine" name="ora-fine">

        <label for="note">Note aggiuntive</label>
        <textarea id="note" name="note" placeholder="Note aggiuntive" rows="4"></textarea>

        <br>
        <input type="submit" value="Prenota">
        <input type="reset" value="Annulla">

    </form>
</div>

<div id="footer">
    <p>
        <strong>ParkUp</strong> - Progetto per il corso di Tecnologie Web <br>
        Università degli Studi di Napoli L'Orientale
    </p>
</div>

<script src="js/main.js"></script>

</body>
</html>
